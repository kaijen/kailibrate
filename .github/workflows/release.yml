name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Abhängigkeiten installieren
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      # "flutter pub audit" existiert nicht; OSV-Scanner prüft pubspec.lock
      # gegen die OSV-Datenbank. Zunächst nur warnend (continue-on-error).
      - name: Abhängigkeiten auditieren (OSV-Scanner)
        continue-on-error: true
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan --lockfile=pubspec.lock

      - name: Veraltete Abhängigkeiten loggen
        continue-on-error: true
        run: flutter pub outdated

      - name: Keystore bereitstellen
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n' | base64 --decode \
            > android/app/kailibrate-release.jks

      - name: Release-APK bauen
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PATH: kailibrate-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        # v-Präfix abschneiden, damit versionName "1.7.1" statt "v1.7.1" ist
        run: flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number="${{ github.run_number }}"

      # Schlägt fehl (exit code != 0), wenn die APK nicht korrekt signiert
      # ist – der Release-Upload wird damit automatisch blockiert.
      - name: APK-Signatur verifizieren
        run: |
          "$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | tail -1)/apksigner" \
            verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: APK umbenennen
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/kailibrate-${{ github.ref_name }}.apk

      - name: SBOM erstellen (Syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: kailibrate-${{ github.ref_name }}.sbom.cdx.json
          artifact-name: kailibrate-${{ github.ref_name }}.sbom.cdx.json
          upload-release-assets: false

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          name: kailibrate ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            build/app/outputs/flutter-apk/kailibrate-${{ github.ref_name }}.apk
            kailibrate-${{ github.ref_name }}.sbom.cdx.json
          fail_on_unmatched_files: true
